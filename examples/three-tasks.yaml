schemaVersion: 1

system:
  description: "3-task EDF graph – τ₁(1,3) τ₂(1,4) τ₃(1,3)  m=2"
  m: 2
  tasks:
    - { c: 1, d: 3, name: "τ₁" }
    - { c: 1, d: 4, name: "τ₂" }
    - { c: 1, d: 3, name: "τ₃" }

# Each edge = one time unit: the processor(s) run whatever is active AND
# zero or more new jobs may arrive at the destination state.
# Children list covers all "execute + possible new arrivals" combinations.

nodes:

  # ── t=0  Initial state – all tasks idle ────────────────────────────────────
  - id: n0
    initial: true
    tasks:
      - { c: 0, d: 0, release: none }
      - { c: 0, d: 0, release: none }
      - { c: 0, d: 0, release: none }
    children: [n1_1, n1_12, n1_123]
    borderColor: "#C0392B"

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPTH 1 – first-arrival scenarios from the initial state
  # ═══════════════════════════════════════════════════════════════════════════

  # t=1 | only τ₁ arrives
  - id: n1_1
    tasks:
      - { c: 1, d: 3, release: up   }
      - { c: 0, d: 0, release: none }
      - { c: 0, d: 0, release: none }
    # From here one processor runs τ₁; new arrivals at t=2 branch the graph
    children: [n2_10, n2_12, n2_13]

  # t=1 | τ₁ and τ₂ arrive together
  - id: n1_12
    tasks:
      - { c: 1, d: 3, release: up   }
      - { c: 1, d: 4, release: up   }
      - { c: 0, d: 0, release: none }
    # Both fit on m=2 processors; at t=2 τ₃ may or may not arrive
    children: [n2_12a, n2_12b]

  # t=1 | all three arrive at once
  - id: n1_123
    tasks:
      - { c: 1, d: 3, release: up   }
      - { c: 1, d: 4, release: up   }
      - { c: 1, d: 3, release: up   }
    # EDF: τ₁(d=3) and τ₃(d=3) go to processors, τ₂(d=4) waits
    children: [n2_123]

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPTH 2 – after one time unit from depth-1
  # ═══════════════════════════════════════════════════════════════════════════

  # t=2 | τ₁ executed and finished, no new arrivals
  - id: n2_10
    tasks:
      - { c: 0, d: 2, release: down }
      - { c: 0, d: 0, release: none }
      - { c: 0, d: 0, release: none }
    loopback: [n0]

  # t=2 | τ₁ finished + τ₂ arrives now
  - id: n2_12
    tasks:
      - { c: 0, d: 2, release: down }
      - { c: 1, d: 4, release: up   }
      - { c: 0, d: 0, release: none }
    # τ₂ still pending; at t=3 it executes, and τ₃ may or may not arrive
    children: [n3_20, n3_23]

  # t=2 | τ₁ finished + τ₃ arrives now
  - id: n2_13
    tasks:
      - { c: 0, d: 2, release: down }
      - { c: 0, d: 0, release: none }
      - { c: 1, d: 3, release: up   }
    # τ₃ will execute at t=3
    children: [n3_30]

  # t=2 | τ₁+τ₂ both executed (m=2), no new arrivals  →  both done
  - id: n2_12a
    tasks:
      - { c: 0, d: 2, release: down }
      - { c: 0, d: 3, release: down }
      - { c: 0, d: 0, release: none }
    loopback: [n0]

  # t=2 | τ₁+τ₂ both executed + τ₃ arrives now
  - id: n2_12b
    tasks:
      - { c: 0, d: 2, release: down }
      - { c: 0, d: 3, release: down }
      - { c: 1, d: 3, release: up   }
    children: [n3_30b]

  # t=2 | EDF ran τ₁+τ₃; τ₂ waited (d: 4→3, c stays 1)
  - id: n2_123
    tasks:
      - { c: 0, d: 2, release: down }
      - { c: 1, d: 3, release: none }
      - { c: 0, d: 2, release: down }
    # Only τ₂ remains; at t=3 it executes, and τ₁ may arrive again
    children: [n3_2a, n3_2b]

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPTH 3
  # ═══════════════════════════════════════════════════════════════════════════

  # t=3 | τ₂ executed and finished, no new arrivals  (came from n2_12)
  - id: n3_20
    tasks:
      - { c: 0, d: 1, release: none }
      - { c: 0, d: 3, release: down }
      - { c: 0, d: 0, release: none }
    loopback: [n0]

  # t=3 | τ₂ finished + τ₃ arrives now  (came from n2_12)
  - id: n3_23
    tasks:
      - { c: 0, d: 1, release: none }
      - { c: 0, d: 3, release: down }
      - { c: 1, d: 3, release: up   }
    children: [n4_30]

  # t=3 | τ₃ executed and finished, no new arrivals  (came from n2_13)
  - id: n3_30
    tasks:
      - { c: 0, d: 1, release: none }
      - { c: 0, d: 0, release: none }
      - { c: 0, d: 2, release: down }
    loopback: [n0]

  # t=3 | τ₃ executed and finished, no new arrivals  (came from n2_12b)
  - id: n3_30b
    tasks:
      - { c: 0, d: 1, release: none }
      - { c: 0, d: 2, release: none }
      - { c: 0, d: 2, release: down }
    loopback: [n0]

  # t=3 | τ₂ executed and finished, no new arrivals  (came from n2_123)
  - id: n3_2a
    tasks:
      - { c: 0, d: 1, release: none }
      - { c: 0, d: 2, release: down }
      - { c: 0, d: 1, release: none }
    loopback: [n0]

  # t=3 | τ₂ finished + τ₁ arrives again  (came from n2_123)
  - id: n3_2b
    tasks:
      - { c: 1, d: 3, release: up   }
      - { c: 0, d: 2, release: down }
      - { c: 0, d: 1, release: none }
    children: [n4_1]

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPTH 4
  # ═══════════════════════════════════════════════════════════════════════════

  # t=4 | τ₃ executed and finished  (came from n3_23)
  - id: n4_30
    tasks:
      - { c: 0, d: 0, release: none }
      - { c: 0, d: 2, release: none }
      - { c: 0, d: 2, release: down }
    loopback: [n0]

  # t=4 | τ₁ executed and finished  (came from n3_2b)
  - id: n4_1
    tasks:
      - { c: 0, d: 2, release: down }
      - { c: 0, d: 1, release: none }
      - { c: 0, d: 0, release: none }
    loopback: [n0]

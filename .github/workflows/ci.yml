name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Build
                      script: build
                    - name: Workspace tests
                      script: test
                    - name: Lint
                      script: lint
                    - name: Formatting
                      script: fmt:check
                    - name: Validate example graphs
                      script: schema:validate examples
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Run ${{ matrix.name }}
              run: bun run ${{ matrix.script }}
